<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPCam Engine - Camera Sharing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; padding: 24px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 16px; padding: 28px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #ffffff; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
        p strong { color: #3b82f6; font-weight: 600; }
        .btn { display: block; width: 100%; padding: 14px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px; margin-bottom: 12px; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-sub { background: #1e293b; color: #cbd5e1; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📹</div>
        <h1 id="mainTitle">IPCam Engine</h1>
        <p id="desc">A camera was shared with you. Tap the button below to import it directly into IPCam Engine.</p>
        <a id="btnOpen" href="#" class="btn">🚀 Open in IPCam Engine</a>
        <a id="btnStore" href="https://play.google.com/store/apps/details?id=com.bmstudio.ipcamengine" class="btn btn-sub">Download on Google Play</a>
    </div>

    <script>
        const i18n = {
            en: {
                lang: 'en',
                title: 'IPCam Engine - Camera Sharing',
                desc: 'A camera was shared with you. Tap the button below to import it directly into IPCam Engine.',
                descWithName: 'The camera {name} was shared with you. Tap the button below to import it directly into IPCam Engine.',
                open: '🚀 Open in IPCam Engine',
                store: 'Download on Google Play'
            },
            fr: {
                lang: 'fr',
                title: 'IPCam Engine - Partage de Caméra',
                desc: 'Une caméra a été partagée avec vous. Appuyez sur le bouton ci-dessous pour l\'importer directement dans IPCam Engine.',
                descWithName: 'La chaîne/caméra {name} a été partagée avec vous. Appuyez sur le bouton ci-dessous pour l\'importer directement dans IPCam Engine.',
                open: '🚀 Ouvrir dans IPCam Engine',
                store: 'Télécharger sur Google Play'
            },
            es: {
                lang: 'es',
                title: 'IPCam Engine - Cámara compartida',
                desc: 'Se ha compartido una cámara contigo. Toca el botón de abajo para importarla directamente en IPCam Engine.',
                descWithName: 'La cámara {name} se ha compartido contigo. Toca el botón de abajo para importarla directamente en IPCam Engine.',
                open: '🚀 Abrir en IPCam Engine',
                store: 'Descargar en Google Play'
            },
            pt: {
                lang: 'pt',
                title: 'IPCam Engine - Compartilhamento de Câmera',
                desc: 'Uma câmera foi compartilhada com você. Toque no botão abaixo para importá-la diretamente no IPCam Engine.',
                descWithName: 'A câmera {name} foi compartilhada com você. Toque no botão abaixo para importá-la diretamente no IPCam Engine.',
                open: '🚀 Abrir no IPCam Engine',
                store: 'Baixar no Google Play'
            },
            de: {
                lang: 'de',
                title: 'IPCam Engine - Kamera-Freigabe',
                desc: 'Eine Kamera wurde mit Ihnen geteilt. Tippen Sie auf die Schaltfläche unten, um sie direkt in IPCam Engine zu importieren.',
                descWithName: 'Die Kamera {name} wurde mit Ihnen geteilt. Tippen Sie auf die Schaltfläche unten, um sie direkt in IPCam Engine zu importieren.',
                open: '🚀 In IPCam Engine öffnen',
                store: 'Bei Google Play herunterladen'
            },
            it: {
                lang: 'it',
                title: 'IPCam Engine - Condivisione Telecamera',
                desc: 'Una telecamera è stata condivisa con te. Tocca il pulsante qui sotto per importarla direttamente in IPCam Engine.',
                descWithName: 'La telecamera {name} è stata condivisa con te. Tocca il pulsante qui sotto per importarla direttamente in IPCam Engine.',
                open: '🚀 Apri in IPCam Engine',
                store: 'Scarica su Google Play'
            },
            nl: {
                lang: 'nl',
                title: 'IPCam Engine - Camera Delen',
                desc: 'Er is een camera met u gedeeld. Tik op de onderstaande knop om deze direct in IPCam Engine te importeren.',
                descWithName: 'De camera {name} is met u gedeeld. Tik op de onderstaande knop om deze direct in IPCam Engine te importeren.',
                open: '🚀 Openen in IPCam Engine',
                store: 'Downloaden via Google Play'
            }
        };

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Détection de la langue du système / navigateur (fallback anglais 'en')
        const rawLang = (navigator.languages && navigator.languages[0]) || navigator.language || navigator.userLanguage || 'en';
        const langKey = rawLang.toLowerCase().split('-')[0];
        const t = i18n[langKey] || i18n.en;

        document.documentElement.lang = t.lang;
        document.title = t.title;
        document.getElementById('desc').textContent = t.desc;
        document.getElementById('btnOpen').textContent = t.open;
        document.getElementById('btnStore').textContent = t.store;

        // Gestion du paramètre de nom et du deep link
        const params = new URLSearchParams(window.location.search);
        const data = params.get('data');
        const cameraName = params.get('name');

        if (cameraName) {
            const cleanName = cameraName.trim();
            if (cleanName) {
                document.getElementById('mainTitle').textContent = cleanName;
                if (t.descWithName) {
                    document.getElementById('desc').innerHTML = t.descWithName.replace('{name}', `<strong>${escapeHtml(cleanName)}</strong>`);
                }
            }
        }

        if (data) {
            const appUrl = 'ipcam://camera?data=' + encodeURIComponent(data) + (cameraName ? '&name=' + encodeURIComponent(cameraName) : '');
            const btnOpen = document.getElementById('btnOpen');
            btnOpen.href = appUrl;
            // Tentative de redirection automatique
            window.location.href = appUrl;
        }
    </script>
</body>
</html>
