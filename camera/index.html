<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPCam Engine - Camera Sharing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; padding: 24px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 16px; padding: 28px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #ffffff; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
        .btn { display: block; width: 100%; padding: 14px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px; margin-bottom: 12px; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-sub { background: #1e293b; color: #cbd5e1; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📹</div>
        <h1>IPCam Engine</h1>
        <p id="desc">A camera was shared with you. Tap the button below to import it directly into IPCam Engine.</p>
        <a id="btnOpen" href="#" class="btn">🚀 Open in IPCam Engine</a>
        <a id="btnStore" href="https://play.google.com/store/apps/details?id=com.bmstudio.ipcamengine" class="btn btn-sub">Download on Google Play</a>
    </div>

            },

            },
            id: {

            },
            vi: {
                lang: 'vi',

                desc: 'Một camera đã được chia sẻ với bạn. Nhấn vào nút bên dưới để nhập trực tiếp vào IPCam Engine.',
                open: '🚀 Mở trong IPCam Engine',
                store: 'Tải xuống trên Google Play'
            },
            th: {
                lang: 'th',
                title: 'IPCam Engine - การแชร์กล้อง',
                desc: 'มีผู้แชร์กล้องกับคุณ แตะปุ่มด้านล่างเพื่อนำเข้าสู่ IPCam Engine โดยตรง',
                open: '🚀 เปิดใน IPCam Engine',
                store: 'ดาวน์โหลดบน Google Play'
            },
            sv: {
                lang: 'sv',
                title: 'IPCam Engine - Kameradelning',
                desc: 'En kamera har delats med dig. Tryck på knappen nedan för att importera den direkt till IPCam Engine.',
                open: '🚀 Öppna i IPCam Engine',
                store: 'Hämta på Google Play'
            },
            cs: {
                lang: 'cs',
                title: 'IPCam Engine - Sdílení kamery',
                desc: 'Byla s vámi sdílena kamera. Klepnutím na tlačítko níže ji importujte přímo do IPCam Engine.',
                open: '🚀 Otevřít v IPCam Engine',
                store: 'Stáhnout na Google Play'
            },
            el: {
                lang: 'el',
                title: 'IPCam Engine - Κοινή χρήση κάμερας',
                desc: 'Μια κάμερα κοινοποιήθηκε μαζί σας. Πατήστε το παρακάτω κουμπί για να την εισαγάγετε απευθείας στο IPCam Engine.',
                open: '🚀 Άνοιγμα στο IPCam Engine',
                store: 'Λήψη στο Google Play'
            },
            ro: {
                lang: 'ro',
                title: 'IPCam Engine - Partajare cameră',
                desc: 'O cameră a fost partajată cu tine. Atinge butonul de mai jos pentru a o importa direct în IPCam Engine.',
                open: '🚀 Deschide în IPCam Engine',
                store: 'Descărcați de pe Google Play'
            }
        };

        // Détection de la langue du système / navigateur (fallback anglais 'en')
        const rawLang = (navigator.languages && navigator.languages[0]) || navigator.language || navigator.userLanguage || 'en';
        const langKey = rawLang.toLowerCase().split('-')[0];
        const t = i18n[langKey] || i18n.en;

        document.documentElement.lang = t.lang;
        document.title = t.title;
        document.getElementById('desc').textContent = t.desc;
        document.getElementById('btnOpen').textContent = t.open;
        document.getElementById('btnStore').textContent = t.store;

        // Gestion du deep link et de l'import
        const params = new URLSearchParams(window.location.search);
        const data = params.get('data');
        if (data) {
            const appUrl = 'ipcam://camera?data=' + encodeURIComponent(data);
            const btnOpen = document.getElementById('btnOpen');
            btnOpen.href = appUrl;
            // Tentative de redirection automatique
            window.location.href = appUrl;
        }
    </script>
</body>
</html>
